[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dolean-backend"
version = "0.1.0"
description = "Backend para análisis y corrección de afinación de audio monofónico."
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic==1.14.1",
    "argon2-cffi==23.1.0",
    "celery==5.4.0",
    "email-validator==2.2.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "librosa==0.10.2.post1",
    "minio==7.2.12",
    "numpy==2.0.2",
    "PyJWT==2.10.1",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.1",
    "redis==5.2.1",
    "scipy==1.14.1",
    "soundfile==0.12.1",
    "SQLAlchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

